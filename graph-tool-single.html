<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可视化拓扑构建/分析工具</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
            color: #333;
            overflow: hidden;
        }
        .app-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .canvas-container {
            flex: 1;
            background: #fff;
            position: relative;
            overflow: hidden;
        }
        #graphSvg {
            width: 100%;
            height: 100%;
            cursor: default;
        }

        .toolbar {
            height: 56px;
            background: #fff;
            border-top: 1px solid #e4e7ed;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 10px;
        }
        .tool-btn {
            padding: 8px 16px;
            border: 1px solid #dcdfe6;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .tool-btn:hover {
            border-color: #409eff;
            color: #409eff;
        }
        .tool-btn.active {
            background: #409eff;
            color: #fff;
            border-color: #409eff;
        }
        .tool-divider {
            width: 1px;
            height: 24px;
            background: #e4e7ed;
            margin: 0 5px;
        }

        .control-panel {
            width: 360px;
            padding: 15px;
            overflow-y: auto;
            background: #f5f7fa;
            border-left: 1px solid #e4e7ed;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #34495e;
            font-size: 14px;
            border-left: 3px solid #409eff;
            padding-left: 8px;
        }
        .btn {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            background: #409eff;
            color: #fff;
        }
        .btn:hover { background: #66b1ff; }
        .btn-secondary { background: #909399; }
        .btn-secondary:hover { background: #a6a9ad; }
        .btn-wide { width: 100%; flex: none; margin-bottom: 8px; }

        .form-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .form-item { flex: 1; }
        .form-item label {
            display: block;
            font-size: 12px;
            color: #606266;
            margin-bottom: 3px;
        }
        select, input {
            width: 100%;
            padding: 5px 8px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        select:focus, input:focus { border-color: #409eff; }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }
        .radio-label {
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .result-count {
            color: #e74c3c;
            font-weight: 600;
        }
        .result-list {
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #ebeef5;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 12px;
            margin-top: 8px;
        }
        .result-item {
            padding: 4px 8px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.2s;
        }
        .result-item:hover { background: #ecf5ff; }
        .result-item:last-child { border-bottom: none; }

        .shortest-section {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #e4e7ed;
        }
        .shortest-title {
            font-size: 13px;
            font-weight: 600;
            color: #67c23a;
            margin-bottom: 6px;
        }

        .tip {
            font-size: 12px;
            color: #909399;
            line-height: 1.5;
            margin-top: 5px;
        }
        textarea {
            width: 100%;
            min-height: 60px;
            padding: 6px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-size: 12px;
            resize: vertical;
            outline: none;
        }

        .context-menu {
            position: absolute;
            background: #fff;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            z-index: 9999;
            min-width: 150px;
            display: none;
            user-select: none;
        }
        .menu-item {
            padding: 8px 12px;
            font-size: 13px;
            cursor: pointer;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.2s;
        }
        .menu-item:hover {
            background: #ecf5ff;
            color: #409eff;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item.danger { color: #f56c6c; }
        .menu-item.danger:hover { background: #fef0f0; }
        .menu-subtitle {
            padding: 6px 12px;
            font-size: 11px;
            color: #909399;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .new-node-panel {
            position: absolute;
            background: #fff;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            z-index: 9999;
            width: 220px;
            padding: 12px;
            display: none;
            user-select: none;
        }
        .new-node-panel .panel-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #303133;
            text-align: left;
        }
        .new-node-panel .form-item { margin-bottom: 8px; }
        .new-node-panel .form-item:last-child { margin-bottom: 0; }
        .new-node-panel input[type="color"] {
            height: 28px;
            padding: 2px;
            cursor: pointer;
        }
        .new-node-panel .panel-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            justify-content: flex-end;
        }
        .panel-btn {
            padding: 5px 12px;
            border: 1px solid #dcdfe6;
            background: #fff;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .panel-btn.primary {
            background: #409eff;
            color: #fff;
            border-color: #409eff;
        }

        .node-shape {
            stroke: #fff;
            stroke-width: 2;
            cursor: pointer;
            transition: filter 0.2s;
        }
        .node-shape:hover { filter: brightness(1.1); }
        .node-text {
            fill: #fff;
            font-size: 13px;
            font-weight: 600;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            user-select: none;
        }
        .edge-line, .edge-arc {
            fill: none;
            stroke-width: 2;
            cursor: pointer;
            transition: stroke-width 0.2s;
        }
        .edge-line:hover, .edge-arc:hover { stroke-width: 3; }
        .control-point {
            fill: #fff;
            stroke: #909399;
            stroke-width: 1.5;
            cursor: move;
        }
        .control-point:hover { stroke: #409eff; stroke-width: 2; }

        .temp-draw-line {
            fill: none;
            stroke: #409eff;
            stroke-width: 2;
            stroke-dasharray: 6 4;
            pointer-events: none;
            opacity: 0.8;
        }

        .highlight-edge {
            stroke: #e74c3c !important;
            stroke-width: 3 !important;
        }
        .highlight-node {
            fill: #e74c3c !important;
        }

        /* 画布右上角：弧线自动优化开关 */
        .arc-opt-bar {
            position: absolute;
            top: 10px;
            right: 12px;
            z-index: 50;
            background: rgba(255,255,255,0.92);
            border: 1px solid #e4e7ed;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 4px 10px 4px 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #606266;
            cursor: pointer;
            user-select: none;
        }
        .arc-opt-bar input { display: none; }
        .arc-opt-track {
            width: 30px;
            height: 16px;
            border-radius: 8px;
            background: #dcdfe6;
            position: relative;
            transition: background 0.2s;
            flex: none;
        }
        .arc-opt-track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
            transition: left 0.2s;
        }
        .arc-opt-bar input:checked + .arc-opt-track { background: #409eff; }
        .arc-opt-bar input:checked + .arc-opt-track::after { left: 16px; }
        .arc-opt-bar:hover { border-color: #409eff; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="main-area">
        <div class="canvas-container">
            <svg id="graphSvg">
                <defs>
                    <marker id="arrow-default" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                        <polygon points="0 0, 10 5, 0 10" fill="#606266"/>
                    </marker>
                    <marker id="arrow-start-default" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto">
                        <polygon points="10 0, 0 5, 10 10" fill="#606266"/>
                    </marker>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                        <polygon points="0 0, 10 5, 0 10" fill="#e74c3c"/>
                    </marker>
                    <marker id="arrow-start-red" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                        <polygon points="10 0, 0 5, 10 10" fill="#e74c3c"/>
                    </marker>
                </defs>
                <g id="edgesGroup"></g>
                <g id="nodesGroup"></g>
                <g id="controlPointsGroup"></g>
                <g id="tempDrawGroup"></g>
            </svg>
            <label class="arc-opt-bar" title="开启后：随机生成、拖拽节点、自动布局、新增弧线时自动优化弧线弯曲（手动拖过控制点的弧线除外）">
                <input type="checkbox" id="arcAutoCb" onchange="onArcAutoChange()">
                <span class="arc-opt-track"></span>
                <span>自动优化弧线</span>
            </label>
        </div>
        <div class="toolbar">
            <button class="tool-btn active" data-tool="select" onclick="switchTool('select')">
                <span>🖱</span> 选择工具
            </button>
            <div class="tool-divider"></div>
            <button class="tool-btn" data-tool="draw" onclick="switchTool('draw')">
                <span>✏️</span> 连线工具
            </button>
            <div class="tool-divider"></div>
            <button class="tool-btn" onclick="addNode()">
                <span>➕</span> 添加节点
            </button>
            <div class="tool-divider"></div>
            <button class="tool-btn" onclick="layoutGraph()">
                <span>🧲</span> 自动布局
            </button>
            <button class="tool-btn" onclick="clearAll()">
                <span>🗑</span> 清空画布
            </button>
        </div>
    </div>

    <div class="control-panel">
        <div class="panel-title">可视化拓扑构建/分析工具</div>

        <div class="card">
            <div class="card-title">🎲 随机生成拓扑</div>

            <div class="form-item" style="margin-bottom:8px;">
                <label>结构预设</label>
                <select id="randPreset" onchange="togglePreset()">
                    <option value="random">完全随机</option>
                    <option value="ring">⭕ 环形</option>
                    <option value="star">⭐ 星形</option>
                    <option value="tree">🌲 树形（连通无环）</option>
                    <option value="wheel">☸️ 轮辐</option>
                    <option value="grid">🕸️ 网格</option>
                </select>
            </div>

            <div class="radio-group" id="randModeRow">
                <label class="radio-label"><input type="radio" name="randMode" value="fixed" checked onchange="toggleRandMode()"> 指定数量</label>
                <label class="radio-label"><input type="radio" name="randMode" value="range" onchange="toggleRandMode()"> 完全随机</label>
            </div>

            <div class="form-row" id="randFixedRow">
                <div class="form-item">
                    <label>节点数量</label>
                    <input type="number" id="randNodeCount" min="2" max="60" value="8">
                </div>
                <div class="form-item">
                    <label>连线数量</label>
                    <input type="number" id="randEdgeCount" min="0" value="10">
                </div>
            </div>

            <div class="form-row" id="randNodeRangeRow" style="display:none;">
                <div class="form-item">
                    <label>节点数范围（最少 ~ 最多）</label>
                    <div style="display:flex;gap:8px;">
                        <input type="number" id="randNodeMin" min="2" max="60" value="6">
                        <input type="number" id="randNodeMax" min="2" max="60" value="12">
                    </div>
                </div>
            </div>

            <div class="form-row" id="randEdgeRangeRow" style="display:none;">
                <div class="form-item">
                    <label>连线数范围（最少 ~ 最多）</label>
                    <div style="display:flex;gap:8px;">
                        <input type="number" id="randEdgeMin" min="0" value="4">
                        <input type="number" id="randEdgeMax" min="0" value="15">
                    </div>
                </div>
            </div>

            <!-- 环形/星形/树/轮辐：只需节点数，连线按预设自动 -->
            <div class="form-row" id="randPresetNodeRow" style="display:none;">
                <div class="form-item">
                    <label id="randPresetNodeLabel">节点数量</label>
                    <input type="number" id="randPresetNodeCount" min="3" max="100" value="10">
                </div>
            </div>

            <!-- 网格：行列决定节点数 -->
            <div class="form-row" id="randGridRow" style="display:none;">
                <div class="form-item">
                    <label>行数</label>
                    <input type="number" id="randGridRows" min="2" max="20" value="4">
                </div>
                <div class="form-item">
                    <label>列数</label>
                    <input type="number" id="randGridCols" min="2" max="20" value="6">
                </div>
            </div>

            <div class="radio-group" style="margin-bottom:0;">
                <label class="radio-label"><input type="checkbox" id="randShape" checked> 随机形状</label>
                <label class="radio-label"><input type="checkbox" id="randColor" checked> 随机颜色</label>
                <label class="radio-label"><input type="checkbox" id="randSize" checked> 随机大小</label>
                <label class="radio-label"><input type="checkbox" id="randEdgeType" checked> 随机连线</label>
            </div>

            <div class="form-row" style="margin-top:8px;margin-bottom:0;">
                <button class="btn" onclick="generateRandomTopology()">🎲 立即生成</button>
            </div>
            <div class="tip" id="randPresetTip">完全随机：节点/连线数量在范围内随机选取。连线数上限 = 节点数 ×（节点数-1），超限自动截断。</div>
        </div>

        <div class="card">
            <div class="card-title">数据导入导出</div>
            <textarea id="importText" placeholder="格式示例：0-1，0~1，0=2，1~~3"></textarea>
            <div class="form-row" style="margin-top: 8px;">
                <button class="btn" onclick="importFromText()">导入</button>
                <button class="btn btn-secondary" onclick="exportToText()">导出</button>
            </div>
            <div class="tip">支持单向(-/~)、双向(=/~~)，中文/英文逗号/换行分隔</div>
        </div>

        <div class="card">
            <div class="card-title">环路分析</div>
            <button class="btn btn-wide" onclick="calculateCycles()">计算所有简单环路</button>
            <div>共找到 <span class="result-count" id="cycleCount">0</span> 个环路</div>
            <div class="result-list" id="cycleList"></div>
            <div class="tip">点击环路高亮显示，2秒后自动取消</div>
        </div>

        <div class="card">
            <div class="card-title">两点路径分析</div>
            <div class="form-row">
                <div class="form-item">
                    <label>起点</label>
                    <select id="pathStart"></select>
                </div>
                <div class="form-item">
                    <label>终点</label>
                    <select id="pathEnd"></select>
                </div>
            </div>
            <button class="btn btn-wide" onclick="calculatePaths()">查询所有路径</button>
            <div>简单路径总数：<span class="result-count" id="pathCount">0</span></div>
            
            <div class="shortest-section">
                <div class="shortest-title">最短路径</div>
                <div>边数：<span class="result-count" id="shortestLen">-</span></div>
                <div>共 <span class="result-count" id="shortestCount">0</span> 条</div>
                <div class="result-list" id="shortestList"></div>
            </div>

            <div style="margin-top:10px;">全部路径：</div>
            <div class="result-list" id="pathList"></div>
            <div class="tip">点击路径高亮显示，2秒后自动取消</div>
        </div>

        <div class="card">
            <div class="card-title">几何交点统计</div>
            <div class="radio-group">
                <label class="radio-label"><input type="radio" name="interType" value="all" checked> 全部交点</label>
                <label class="radio-label"><input type="radio" name="interType" value="line-line"> 直线-直线</label>
                <label class="radio-label"><input type="radio" name="interType" value="line-arc"> 直线-弧线</label>
                <label class="radio-label"><input type="radio" name="interType" value="arc-arc"> 弧线-弧线</label>
            </div>
            <button class="btn btn-wide" onclick="calculateIntersections()">统计交点数量</button>
            <div>共 <span class="result-count" id="intersectionCount">0</span> 个交叉点</div>
            <div class="tip">弧线采用离散采样计算，节点连接处不计入</div>
        </div>
    </div>
</div>

<div id="contextMenu" class="context-menu"></div>

<div id="newNodePanel" class="new-node-panel">
    <div class="panel-title">新建节点与连线</div>
    <div class="form-item">
        <label>节点颜色</label>
        <input type="color" id="newNodeColor" value="#409eff">
    </div>
    <div class="form-item">
        <label>节点形状</label>
        <select id="newNodeShape">
            <option value="circle">● 圆形</option>
            <option value="square">■ 方形</option>
            <option value="triangle">▲ 三角形</option>
            <option value="pentagon">⬠ 五边形</option>
            <option value="hexagon">⬡ 六边形</option>
        </select>
    </div>
    <div class="form-item">
        <label>连线类型</label>
        <select id="newEdgeType">
            <option value="-">单向直线</option>
            <option value="~">单向弧线</option>
            <option value="=">双向直线</option>
            <option value="~~">双向弧线</option>
        </select>
    </div>
    <div class="panel-btns">
        <button class="panel-btn" onclick="closeNewNodePanel(false)">取消</button>
        <button class="panel-btn primary" onclick="closeNewNodePanel(true)">确定</button>
    </div>
</div>

    <script>
// js/core.js — 核心状态、图编辑、SVG 渲染、右键菜单、导入导出、全局重置
// 依赖：无（最先加载）。供 analysis.js / layout.js 调用。

    const svg = document.getElementById('graphSvg');
    const edgesGroup = document.getElementById('edgesGroup');
    const nodesGroup = document.getElementById('nodesGroup');
    const controlPointsGroup = document.getElementById('controlPointsGroup');
    const tempDrawGroup = document.getElementById('tempDrawGroup');
    const contextMenu = document.getElementById('contextMenu');
    const newNodePanel = document.getElementById('newNodePanel');

    let nodes = [];
    let edges = [];
    let nextNodeId = 0;
    let nextEdgeId = 0;

    let currentTool = 'select';
    let dragging = null;
    let drawingTemp = null;
    let newNodeCallback = null;

    let cycles = [];
    let paths = [];
    let activeHighlightType = null;
    let activeHighlightIndex = -1;
    let highlightTimer = null;
    let autoOptimizeArcs = false;   // 画布开关：开启后自动优化弧线形状

    const ARROW_OFFSET = 4;
    const ARC_SAMPLE_STEPS = 24;
    const HIGHLIGHT_DURATION = 2000;

    function getRegularPolygonPoints(cx, cy, radius, sides, rotation = -Math.PI/2) {
        const points = [];
        for (let i = 0; i < sides; i++) {
            const angle = rotation + i * 2 * Math.PI / sides;
            points.push(`${cx + radius * Math.cos(angle)},${cy + radius * Math.sin(angle)}`);
        }
        return points.join(' ');
    }

    // 计算从节点中心沿 angle 方向到形状边缘的实际距离（与渲染的几何一致）
    function getShapeBoundaryRadius(shape, size, angle) {
        if (shape === 'circle') return size;
        if (shape === 'square') {
            // 圆角方形，近似按轴对齐方形处理
            const c = Math.abs(Math.cos(angle));
            const s = Math.abs(Math.sin(angle));
            return size / Math.max(c, s, 1e-6);
        }
        let sides;
        if (shape === 'triangle') sides = 3;
        else if (shape === 'pentagon') sides = 5;
        else if (shape === 'hexagon') sides = 6;
        else return size;

        // 正多边形：外接圆半径 = size，边心距 = size*cos(pi/n)
        // 多边形每条边外法线角（首顶点在正上方，与 getRegularPolygonPoints 一致）
        const apothem = size * Math.cos(Math.PI / sides);
        const step = 2 * Math.PI / sides;
        let best = -Math.PI / 2 + step / 2;
        let bestDiff = Infinity;
        for (let i = 0; i < sides; i++) {
            const beta = -Math.PI / 2 + (2 * i + 1) * step / 2;
            let diff = angle - beta;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            while (diff < -Math.PI) diff += 2 * Math.PI;
            const ad = Math.abs(diff);
            if (ad < bestDiff) { bestDiff = ad; best = beta; }
        }
        let delta = angle - best;
        while (delta > Math.PI) delta -= 2 * Math.PI;
        while (delta < -Math.PI) delta += 2 * Math.PI;
        return apothem / Math.cos(delta);
    }

    // 精确计算边两端点：分别按两端节点自身形状/大小取边界半径，
    // 避免大小、形状不同的节点导致箭头悬空或穿透节点
    function computeBaseEdgeEndpoints(u, v) {
        const dx = v.x - u.x;
        const dy = v.y - u.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const aUV = Math.atan2(dy, dx);
        const rU = getShapeBoundaryRadius(u.shape, u.size, aUV) + ARROW_OFFSET;
        const rV = getShapeBoundaryRadius(v.shape, v.size, aUV + Math.PI) + ARROW_OFFSET;
        return {
            x1: u.x + dx * rU / len,
            y1: u.y + dy * rU / len,
            x2: v.x - dx * rV / len,
            y2: v.y - dy * rV / len
        };
    }

    function addEdgeById(u, v, type, bidirectional) {
        if (u === v) return;
        const edge = {
            id: nextEdgeId++,
            u, v, type, bidirectional,
            color: type === '-' ? '#606266' : '#409eff'
        };
        if (type === '~') {
            edge.controlPoint = computeDefaultControlPoint(u, v);
            edge.manualCp = false;  // 该弧线控制点尚未被手动拖拽过
        }
        edges.push(edge);
        return edge;
    }

    function computeDefaultControlPoint(uId, vId) {
        const u = getNodeById(uId);
        const v = getNodeById(vId);
        const dx = v.x - u.x;
        const dy = v.y - u.y;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const offset = len * 0.25;
        const nx = -dy / len * offset;
        const ny = dx / len * offset;
        return { x: (u.x + v.x) / 2 + nx, y: (u.y + v.y) / 2 + ny };
    }

    // ===== 弧线自动优化 =====
    // 在“自动优化弧线”开启时调用：让每条未经手动调整的弧线自动选择更合适的
    // 弯曲方向与幅度——避开途经的节点、平行弧线交错分布在两侧，观感更整齐。
    function sampleBezierXY(x1, y1, cx, cy, x2, y2, steps) {
        const pts = [];
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const mt = 1 - t;
            pts.push({
                x: mt * mt * x1 + 2 * mt * t * cx + t * t * x2,
                y: mt * mt * y1 + 2 * mt * t * cy + t * t * y2
            });
        }
        return pts;
    }

    // 返回弧线穿过其它节点的“穿透程度”，0 表示完全避让干净
    function arcCollisionScore(u, v, cp) {
        const pts = sampleBezierXY(u.x, u.y, cp.x, cp.y, v.x, v.y, 16);
        let worst = 0;
        for (const n of nodes) {
            if (n.id === u.id || n.id === v.id) continue;
            const need = n.size + 8;
            for (const p of pts) {
                const d = Math.hypot(p.x - n.x, p.y - n.y);
                if (d < need) {
                    const pen = need - d;
                    if (pen > worst) worst = pen;
                }
            }
        }
        return worst;
    }

    // 为单条弧线挑选一个较好的控制点（返回 { cp, score, h }）
    function pickArcControl(u, v, forcedSide) {
        const dx = v.x - u.x;
        const dy = v.y - u.y;
        const len = Math.hypot(dx, dy) || 1;
        // 左法线（与 computeDefaultControlPoint 一致：默认弧线向左侧弯曲）
        const nx = -dy / len;
        const ny = dx / len;
        const mx = (u.x + v.x) / 2;
        const my = (u.y + v.y) / 2;
        const minR = Math.max(u.size, v.size);
        // 基准弯曲高度：过短/节点过大时保证仍有可见弯曲，同时避免过度外甩
        const hBase = Math.min(Math.max(len * 0.28, minR + 12), len * 0.8);
        const sides = forcedSide ? [forcedSide] : [1, -1];
        const mults = [1, 1.9, 3.2];
        let best = null;
        for (const side of sides) {
            for (const mult of mults) {
                const h = hBase * mult;
                const cp = { x: mx + nx * h * side, y: my + ny * h * side };
                const score = arcCollisionScore(u, v, cp);
                if (!best || score < best.score || (score === best.score && h < best.h)) {
                    best = { cp, score, h };
                }
            }
        }
        return best;
    }

    function optimizeArcs() {
        if (!autoOptimizeArcs) return;
        if (nodes.length < 2) return;

        // 统计同一“有向节点对”上的平行弧线，避免同向多条弧线完全重叠
        const dirCount = {};
        edges.forEach(e => {
            if (e.type === '~' && e.controlPoint) {
                const k = e.u + '>' + e.v;
                dirCount[k] = (dirCount[k] || 0) + 1;
            }
        });
        const laneUsed = {};

        edges.forEach(edge => {
            if (edge.type !== '~' || !edge.controlPoint || edge.manualCp) return;
            const u = getNodeById(edge.u);
            const v = getNodeById(edge.v);
            if (!u || !v) return;

            const k = edge.u + '>' + edge.v;
            const lane = laneUsed[k] || 0;
            laneUsed[k] = lane + 1;

            // 若同向存在多条平行弧线，按次序左右交错，防止彼此重叠
            const forcedSide = dirCount[k] > 1 ? (lane % 2 === 0 ? 1 : -1) : null;
            const res = pickArcControl(u, v, forcedSide);
            if (res) {
                edge.controlPoint = res.cp;
            }
        });
    }

    // 仅在开关开启时触发一次“优化 + 重绘”
    function maybeOptimizeArcs() {
        if (!autoOptimizeArcs) return;
        optimizeArcs();
        render();
    }

    // 画布角落开关
    function onArcAutoChange() {
        const cb = document.getElementById('arcAutoCb');
        autoOptimizeArcs = !!cb.checked;
        if (autoOptimizeArcs) {
            maybeOptimizeArcs();
        }
    }

    function deleteEdge(id) {
        edges = edges.filter(e => e.id !== id);
        render();
        hideAllMenus();
    }

    function toggleEdgeShape(id) {
        const edge = edges.find(e => e.id === id);
        if (edge.type === '-') {
            edge.type = '~';
            edge.controlPoint = computeDefaultControlPoint(edge.u, edge.v);
            edge.manualCp = false;
            edge.color = '#409eff';
        } else {
            edge.type = '-';
            delete edge.controlPoint;
            delete edge.manualCp;
            edge.color = '#606266';
        }
        render();
        if (edge.type === '~') maybeOptimizeArcs();
        hideAllMenus();
    }

    function toggleEdgeDirection(id) {
        const edge = edges.find(e => e.id === id);
        edge.bidirectional = !edge.bidirectional;
        render();
        hideAllMenus();
    }

    function changeEdgeColor(id) {
        const edge = edges.find(e => e.id === id);
        const input = document.createElement('input');
        input.type = 'color';
        input.value = edge.color;
        input.onchange = () => {
            edge.color = input.value;
            render();
        };
        input.click();
        hideAllMenus();
    }

    function render() {
        renderEdges();
        renderNodes();
        renderControlPoints();
    }

    function renderNodes() {
        nodesGroup.innerHTML = '';
        nodes.forEach(node => {
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            
            let shapeEl;
            const s = node.size;

            if (node.shape === 'circle') {
                shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                shapeEl.setAttribute('cx', node.x);
                shapeEl.setAttribute('cy', node.y);
                shapeEl.setAttribute('r', s);
            } else if (node.shape === 'square') {
                shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                shapeEl.setAttribute('x', node.x - s);
                shapeEl.setAttribute('y', node.y - s);
                shapeEl.setAttribute('width', s * 2);
                shapeEl.setAttribute('height', s * 2);
                shapeEl.setAttribute('rx', 3);
            } else if (node.shape === 'triangle') {
                shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                shapeEl.setAttribute('points', getRegularPolygonPoints(node.x, node.y, s, 3));
            } else if (node.shape === 'pentagon') {
                shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                shapeEl.setAttribute('points', getRegularPolygonPoints(node.x, node.y, s, 5));
            } else if (node.shape === 'hexagon') {
                shapeEl = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                shapeEl.setAttribute('points', getRegularPolygonPoints(node.x, node.y, s, 6));
            }

            shapeEl.classList.add('node-shape');
            shapeEl.style.fill = node.color;
            shapeEl.dataset.nodeId = node.id;

            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', node.x);
            text.setAttribute('y', node.y);
            text.classList.add('node-text');
            text.textContent = node.id;

            g.appendChild(shapeEl);
            g.appendChild(text);
            nodesGroup.appendChild(g);
        });
    }

    function renderEdges() {
        edgesGroup.innerHTML = '';

        // 第一步：统计每个节点上的所有箭头落点（含双向边两端），记录入射角
        const incomingMap = {}; // nodeId -> [{edge, direction, hubId, angle}]
        edges.forEach(edge => {
            const u = getNodeById(edge.u);
            const v = getNodeById(edge.v);
            if (!u || !v) return;

            // u -> v 方向（箭头落在 v 上）
            const angleUV = Math.atan2(v.y - u.y, v.x - u.x);
            if (!incomingMap[v.id]) incomingMap[v.id] = [];
            incomingMap[v.id].push({ edge, direction: 'forward', hubId: v.id, angle: angleUV });

            // 双向边 v -> u 方向（箭头落在 u 上）
            if (edge.bidirectional) {
                const angleVU = Math.atan2(u.y - v.y, u.x - v.x);
                if (!incomingMap[u.id]) incomingMap[u.id] = [];
                incomingMap[u.id].push({ edge, direction: 'backward', hubId: u.id, angle: angleVU });
            }
        });

        // 第二步：把每个节点的箭头沿“节点边缘”扇形排布。
        // 与原切线平移不同，落点始终保持在节点边界环上，因此不会偏移出节点范围；
        // 相邻箭头按约 12px 弧距错开并限制最大偏转 60°，避免箭头互相重叠。
        const landingPoint = {}; // "edgeId_direction" -> {x, y}
        const FAN_STEP = 12;     // 相邻箭头在节点边缘的最小弧距（像素）
        const FAN_MAX_DELTA = Math.PI / 3; // 最大偏转角度 ±60°
        Object.keys(incomingMap).forEach(nodeId => {
            const hub = getNodeById(+nodeId);
            if (!hub) return;
            const list = incomingMap[nodeId];
            list.sort((a, b) => a.angle - b.angle);
            const n = list.length;
            list.forEach((item, i) => {
                // 从节点中心指向“来箭方向”的落点基准角（入射角反向）
                const aIn = item.angle + Math.PI;
                const rb = getShapeBoundaryRadius(hub.shape, hub.size, aIn);
                // 弧长 -> 圆心角：delta = 弧长 / 边界半径
                let delta = 0;
                if (n > 1) {
                    const arc = (i - (n - 1) / 2) * FAN_STEP;
                    delta = arc / Math.max(rb, 1);
                    delta = Math.max(-FAN_MAX_DELTA, Math.min(FAN_MAX_DELTA, delta));
                }
                const ang = aIn + delta;
                // 落点半径需按最终角度再求一次边界，保证箭头始终紧贴实际边缘
                const rbAng = getShapeBoundaryRadius(hub.shape, hub.size, ang);
                landingPoint[`${item.edge.id}_${item.direction}`] = {
                    x: hub.x + Math.cos(ang) * (rbAng + ARROW_OFFSET),
                    y: hub.y + Math.sin(ang) * (rbAng + ARROW_OFFSET)
                };
            });
        });

        // 第三步：渲染每条边，应用按形状精确计算的端点与扇形落点
        edges.forEach(edge => {
            const u = getNodeById(edge.u);
            const v = getNodeById(edge.v);
            if (!u || !v) return;

            const base = computeBaseEdgeEndpoints(u, v);
            let x1 = base.x1, y1 = base.y1;
            let x2 = base.x2, y2 = base.y2;

            const fwd = landingPoint[`${edge.id}_forward`];
            if (fwd) { x2 = fwd.x; y2 = fwd.y; }
            if (edge.bidirectional) {
                const bwd = landingPoint[`${edge.id}_backward`];
                if (bwd) { x1 = bwd.x; y1 = bwd.y; }
            }

            let pathEl;
            if (edge.type === '~' && edge.controlPoint) {
                pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                pathEl.setAttribute('d', `M ${x1} ${y1} Q ${edge.controlPoint.x} ${edge.controlPoint.y} ${x2} ${y2}`);
                pathEl.classList.add('edge-arc');
            } else {
                pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                pathEl.setAttribute('x1', x1);
                pathEl.setAttribute('y1', y1);
                pathEl.setAttribute('x2', x2);
                pathEl.setAttribute('y2', y2);
                pathEl.classList.add('edge-line');
            }

            pathEl.style.stroke = edge.color;
            pathEl.dataset.edgeId = edge.id;

            if (edge.bidirectional) {
                pathEl.setAttribute('marker-start', 'url(#arrow-start-default)');
                pathEl.setAttribute('marker-end', 'url(#arrow-default)');
            } else {
                pathEl.setAttribute('marker-end', 'url(#arrow-default)');
            }

            edgesGroup.appendChild(pathEl);
        });
    }

    function renderControlPoints() {
        controlPointsGroup.innerHTML = '';
        if (currentTool !== 'select') return;

        edges.forEach(edge => {
            if (edge.type !== '~' || !edge.controlPoint) return;
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', edge.controlPoint.x);
            circle.setAttribute('cy', edge.controlPoint.y);
            circle.setAttribute('r', 5);
            circle.classList.add('control-point');
            circle.dataset.edgeId = edge.id;
            controlPointsGroup.appendChild(circle);
        });
    }

    function clearTempDraw() {
        tempDrawGroup.innerHTML = '';
    }

    function updateTempDraw(x1, y1, x2, y2) {
        tempDrawGroup.innerHTML = '';
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', x1);
        line.setAttribute('y1', y1);
        line.setAttribute('x2', x2);
        line.setAttribute('y2', y2);

    function bindEvents() {
        svg.addEventListener('mousedown', onMouseDown);
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
        svg.addEventListener('contextmenu', onContextMenu);

        document.addEventListener('mousedown', (e) => {
            if (!e.target.closest('.context-menu') && 
                !e.target.closest('.new-node-panel') &&
                !e.target.closest('#graphSvg')) {
                hideAllMenus();
            }
        });
    }

    function getSvgPoint(e) {
        const rect = svg.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    function getNodeAtPoint(x, y) {
        for (let i = nodes.length - 1; i >= 0; i--) {
            const node = nodes[i];
            const dx = x - node.x;
            const dy = y - node.y;
            if (Math.sqrt(dx*dx + dy*dy) <= node.size) {
                return node;
            }
        }
        return null;
    }

    function onMouseDown(e) {
        if (e.button !== 0) return;
        hideAllMenus();

        const point = getSvgPoint(e);
        const target = e.target;

        if (target.classList.contains('node-shape')) {
            const nodeId = parseInt(target.dataset.nodeId);
            const node = getNodeById(nodeId);

            if (currentTool === 'select') {
                // 记录关联弧线控制点与节点的相对偏移，拖动时保持自定义形状
                const arcOffsets = [];
                edges.forEach(edge => {
                    if (edge.type === '~' && edge.controlPoint) {
                        if (edge.u === nodeId || edge.v === nodeId) {
                            arcOffsets.push({
                                edge: edge,
                                dx: edge.controlPoint.x - node.x,
                                dy: edge.controlPoint.y - node.y
                            });
                        }
                    }
                });

                dragging = {
                    type: 'node',
                    target: node,
                    offsetX: point.x - node.x,
                    offsetY: point.y - node.y,
                    arcOffsets: arcOffsets
                };
            } else if (currentTool === 'draw') {
                drawingTemp = { startNodeId: nodeId, startX: node.x, startY: node.y };
                updateTempDraw(node.x, node.y, point.x, point.y);
            }
            return;
        }

        if (target.classList.contains('control-point')) {
            const edgeId = parseInt(target.dataset.edgeId);
            const edge = edges.find(e => e.id === edgeId);
            dragging = {
                type: 'control',
                target: edge,
                offsetX: point.x - edge.controlPoint.x,
                offsetY: point.y - edge.controlPoint.y
            };
            return;
        }

        if (currentTool === 'select') {
            clearHighlight();
        }
    }

    function onMouseMove(e) {
        const point = getSvgPoint(e);

        if (dragging) {
            if (dragging.type === 'node') {
                dragging.target.x = point.x - dragging.offsetX;
                dragging.target.y = point.y - dragging.offsetY;
                
                // 按偏移量同步更新关联弧线控制点，保持自定义弯曲形状
                if (dragging.arcOffsets) {
                    dragging.arcOffsets.forEach(item => {
                        item.edge.controlPoint.x = dragging.target.x + item.dx;
                        item.edge.controlPoint.y = dragging.target.y + item.dy;
                    });
                }
            } else if (dragging.type === 'control') {
                dragging.target.controlPoint.x = point.x - dragging.offsetX;
                dragging.target.controlPoint.y = point.y - dragging.offsetY;
            }
            render();
            return;
        }

        if (currentTool === 'draw' && drawingTemp) {
            updateTempDraw(drawingTemp.startX, drawingTemp.startY, point.x, point.y);
        }
    }

    function onMouseUp(e) {
        const point = getSvgPoint(e);

        if (dragging) {
            const wasDragging = dragging;
            dragging = null;

            if (wasDragging.type === 'control' && wasDragging.target) {
                // 用户手动拖过该弧线控制点 → 之后不再被自动优化覆盖
                wasDragging.target.manualCp = true;
            } else if (wasDragging.type === 'node' && autoOptimizeArcs) {
                // 开启自动优化时，节点移动结束后重排其关联的弧线形状
                optimizeArcs();
                render();
            }

            if (activeHighlightIndex >= 0) {
                if (activeHighlightType === 'cycle') highlightCycle(activeHighlightIndex);
                else if (activeHighlightType === 'path') highlightPath(activeHighlightIndex);
            }
            return;
        }

        if (currentTool === 'draw' && drawingTemp) {
            const targetNode = getNodeAtPoint(point.x, point.y);
            
            if (targetNode && targetNode.id !== drawingTemp.startNodeId) {
                const startId = drawingTemp.startNodeId;
                const endId = targetNode.id;
                setTimeout(() => {
                    showEdgeTypeMenu(e.clientX, e.clientY, startId, endId);
                }, 10);
            } else if (!targetNode) {
                const startId = drawingTemp.startNodeId;
                const endX = point.x;
                const endY = point.y;
                setTimeout(() => {
                    openNewNodePanel(e.clientX, e.clientY, (config) => {
                        const newNode = addNode(endX, endY, config.color, config.shape);
                        let type, bidir;
                        if (config.edgeType === '-') { type = '-'; bidir = false; }
                        else if (config.edgeType === '~') { type = '~'; bidir = false; }
                        else if (config.edgeType === '=') { type = '-'; bidir = true; }
                        else { type = '~'; bidir = true; }
                        addEdgeById(startId, newNode.id, type, bidir);
                        render();
                        maybeOptimizeArcs();
                    });
                }, 10);
            }

            drawingTemp = null;
            clearTempDraw();
        }
    }

    function exportToText() {
        const parts = [];
        edges.forEach(e => {
            let sep;
            if (e.bidirectional) {
                sep = e.type === '-' ? '=' : '~~';
            } else {
                sep = e.type;
            }
            parts.push(`${e.u}${sep}${e.v}`);
        });
        document.getElementById('importText').value = parts.join('，');
    }

    function importFromText() {
        const text = document.getElementById('importText').value;
        if (!text.trim()) return;

        nodes = []; edges = [];
        nextNodeId = 0; nextEdgeId = 0;

        const list = text.split(/[，,\n\r]/).map(s => s.trim()).filter(s => s !== '');
        const pattern = /^(\d+)(-|~|=|~~)(\d+)$/;
        const nodeSet = new Set();
        list.forEach(s => {
            const m = s.match(pattern);
            if (m) { nodeSet.add(+m[1]); nodeSet.add(+m[3]); }
        });

        const nodeArr = Array.from(nodeSet).sort((a,b) => a-b);
        const rect = svg.getBoundingClientRect();
        const cx = rect.width / 2, cy = rect.height / 2;
        const radius = Math.min(cx, cy) * 0.7;

        nodeArr.forEach((id, i) => {
            const angle = -Math.PI/2 + i * 2 * Math.PI / nodeArr.length;
            nodes.push({
                id, x: cx + radius*Math.cos(angle), y: cy + radius*Math.sin(angle),
                color: '#409eff', shape: 'circle', size: 18
            });
            if (id >= nextNodeId) nextNodeId = id + 1;
        });

        list.forEach(s => {
            const m = s.match(pattern);
            if (m) {
                const u = +m[1], sep = m[2], v = +m[3];
                let type, bidir;
                if (sep === '-') { type='-'; bidir=false; }
                else if (sep === '~') { type='~'; bidir=false; }
                else if (sep === '=') { type='-'; bidir=true; }
                else { type='~'; bidir=true; }
                addEdgeById(u, v, type, bidir);
            }
        });

        updatePathSelects();
        render();
        maybeOptimizeArcs();
    }

// js/analysis.js — 拓扑分析：环路、两点路径、几何交点统计
// 依赖：core.js

    function buildCalcEdges() {
        const res = [];
        edges.forEach(e => {
            res.push({ u: e.u, v: e.v, type: e.type, sourceId: e.id, direction: 'forward' });
            if (e.bidirectional) {
                res.push({ u: e.v, v: e.u, type: e.type, sourceId: e.id, direction: 'backward' });
            }
        });
        return res;
    }

    function getCycleString(seq) {
        let str = String(seq[0].u);
        seq.forEach(e => str += e.type + e.v);
        return str;
    }

    function getCanonical(seq) {
        let best = null;
        for (let r = 0; r < seq.length; r++) {
            const rot = [];
            for (let i = 0; i < seq.length; i++) rot.push(seq[(r+i) % seq.length]);
            const s = getCycleString(rot);
            if (best === null || s < best) best = s;
        }
        return best;
    }

    function calculateCycles() {
        clearHighlight();
        const calcEdges = buildCalcEdges();
        if (calcEdges.length === 0) { alert('请先添加边'); return; }

        const adj = {};
        const allNodes = new Set();
        calcEdges.forEach(e => {
            if (!adj[e.u]) adj[e.u] = [];
            adj[e.u].push(e);
            allNodes.add(e.u); allNodes.add(e.v);
        });

        const cycleMap = new Map();
        function search(start, current, pathNodes, pathEdges) {
            (adj[current] || []).forEach(edge => {
                if (edge.v === start) {
                    if (pathEdges.length >= 1) {
                        const fullSeq = [...pathEdges, edge];
                        const canon = getCanonical(fullSeq);
                        if (!cycleMap.has(canon)) {
                            cycleMap.set(canon, fullSeq);
                        }
                    }
                } else if (!pathNodes.has(edge.v)) {
                    const newNodes = new Set(pathNodes);
                    newNodes.add(edge.v);
                    search(start, edge.v, newNodes, [...pathEdges, edge]);
                }
            });
        }

        allNodes.forEach(n => search(n, n, new Set([n]), []));
        
        const sortedKeys = Array.from(cycleMap.keys()).sort();
        cycles = sortedKeys.map(key => ({ str: key, edges: cycleMap.get(key) }));

        document.getElementById('cycleCount').textContent = cycles.length;
        renderCycleList();
    }

        list.innerHTML = '';

    function calculatePaths() {
        clearHighlight();
        const start = +document.getElementById('pathStart').value;
        const end = +document.getElementById('pathEnd').value;
        if (start === end) { alert('起点和终点不能相同'); return; }

        const calcEdges = buildCalcEdges();
        const adj = {};
        calcEdges.forEach(e => {
            if (!adj[e.u]) adj[e.u] = [];
            adj[e.u].push(e);
        });

        const pathList = [];
        function dfs(current, pathNodes, pathEdges) {
            if (current === end) {
                let str = String(pathEdges[0].u);
                pathEdges.forEach(e => str += e.type + e.v);
                pathList.push({ str, edges: [...pathEdges] });
                return;
            }
            (adj[current] || []).forEach(edge => {
                if (!pathNodes.has(edge.v)) {
                    const newNodes = new Set(pathNodes);
                    newNodes.add(edge.v);
                    dfs(edge.v, newNodes, [...pathEdges, edge]);
                }
            });
        }
        dfs(start, new Set([start]), []);

        pathList.sort((a,b) => a.edges.length - b.edges.length);
        paths = pathList;

        document.getElementById('pathCount').textContent = paths.length;

        if (paths.length > 0) {
            const minLen = paths[0].edges.length;
            const shortestPaths = paths.filter(p => p.edges.length === minLen);
            
            document.getElementById('shortestLen').textContent = minLen;
            document.getElementById('shortestCount').textContent = shortestPaths.length;
            
            const shortList = document.getElementById('shortestList');
            shortList.innerHTML = '';
            shortestPaths.forEach((p, i) => {
                const item = document.createElement('div');
                item.className = 'result-item';

                item.onclick = () => {

                };
                shortList.appendChild(item);
            });
        } else {
            document.getElementById('shortestLen').textContent = '-';
            document.getElementById('shortestCount').textContent = '0';
            document.getElementById('shortestList').innerHTML = '';
        }

        const list = document.getElementById('pathList');

            const item = document.createElement('div');
            item.className = 'result-item';
            item.textContent = `${i+1}. ${p.str}`;
            item.onclick = () => highlightPath(i);
            list.appendChild(item);
        });
    }

    function sampleQuadratic(p0, p1, p2, steps) {
        const points = [];
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const x = (1-t)*(1-t)*p0.x + 2*(1-t)*t*p1.x + t*t*p2.x;
            const y = (1-t)*(1-t)*p0.y + 2*(1-t)*t*p1.y + t*t*p2.y;
            points.push({ x, y });
        }
        return points;
    }

    function segIntersect(a1, a2, b1, b2) {
        const eps = 1e-6;
        const cross = (x1,y1,x2,y2) => x1*y2 - x2*y1;

        const share = 
            (Math.abs(a1.x-b1.x)<eps && Math.abs(a1.y-b1.y)<eps) ||
            (Math.abs(a1.x-b2.x)<eps && Math.abs(a1.y-b2.y)<eps) ||
            (Math.abs(a2.x-b1.x)<eps && Math.abs(a2.y-b1.y)<eps) ||
            (Math.abs(a2.x-b2.x)<eps && Math.abs(a2.y-b2.y)<eps);
        if (share) return false;

        const d1 = cross(b2.x-b1.x, b2.y-b1.y, a1.x-b1.x, a1.y-b1.y);
        const d2 = cross(b2.x-b1.x, b2.y-b1.y, a2.x-b1.x, a2.y-b1.y);
        const d3 = cross(a2.x-a1.x, a2.y-a1.y, b1.x-a1.x, b1.y-a1.y);
        const d4 = cross(a2.x-a1.x, a2.y-a1.y, b2.x-a1.x, b2.y-a1.y);

        return ((d1>eps && d2<-eps) || (d1<-eps && d2>eps)) &&
               ((d3>eps && d4<-eps) || (d3<-eps && d4>eps));
    }

    function getEdgeSegments(edge) {
        const u = getNodeById(edge.u);
        const v = getNodeById(edge.v);
        if (!u || !v) return [];

        const base = computeBaseEdgeEndpoints(u, v);
        const x1 = base.x1, y1 = base.y1;
        const x2 = base.x2, y2 = base.y2;

        if (edge.type === '-' || !edge.controlPoint) {
            return [{ p1: {x:x1,y:y1}, p2: {x:x2,y:y2} }];
        } else {
            const samples = sampleQuadratic(
                {x:x1, y:y1},
                edge.controlPoint,
                {x:x2, y:y2},
                ARC_SAMPLE_STEPS
            );
            const segs = [];
            for (let i = 0; i < samples.length - 1; i++) {
                segs.push({ p1: samples[i], p2: samples[i+1] });
            }
            return segs;
        }
    }

    function calculateIntersections() {
        const type = document.querySelector('input[name="interType"]:checked').value;
        
        const lineEdges = [];
        const arcEdges = [];
        edges.forEach(e => {
            if (e.type === '-') lineEdges.push(e);
            else arcEdges.push(e);
        });

        let count = 0;

        if (type === 'all' || type === 'line-line') {
            const lineSegs = lineEdges.map(e => getEdgeSegments(e)[0]);
            for (let i = 0; i < lineSegs.length; i++) {
                for (let j = i + 1; j < lineSegs.length; j++) {
                    if (segIntersect(lineSegs[i].p1, lineSegs[i].p2, lineSegs[j].p1, lineSegs[j].p2)) {
                        count++;
                    }
                }
            }
        }

        if (type === 'all' || type === 'line-arc') {
            const lineSegs = lineEdges.map(e => getEdgeSegments(e)[0]);
            arcEdges.forEach(arc => {
                const arcSegs = getEdgeSegments(arc);
                lineSegs.forEach(ls => {
                    for (let i = 0; i < arcSegs.length; i++) {
                        if (segIntersect(ls.p1, ls.p2, arcSegs[i].p1, arcSegs[i].p2)) {
                            count++;
                            break;
                        }
                    }
                });
            });
        }

        if (type === 'all' || type === 'arc-arc') {
            const allArcSegs = arcEdges.map(e => ({ edge: e, segs: getEdgeSegments(e) }));
            for (let i = 0; i < allArcSegs.length; i++) {
                for (let j = i + 1; j < allArcSegs.length; j++) {
                    let hasInter = false;
                    const segsA = allArcSegs[i].segs;
                    const segsB = allArcSegs[j].segs;
                    for (let a = 0; a < segsA.length && !hasInter; a++) {
                        for (let b = 0; b < segsB.length && !hasInter; b++) {
                            if (segIntersect(segsA[a].p1, segsA[a].p2, segsB[b].p1, segsB[b].p2)) {
                                hasInter = true;
                                count++;
                            }
                        }
                    }
                }
            }
        }

        document.getElementById('intersectionCount').textContent = count;
    }

// js/layout.js — 力导向自动布局、随机拓扑生成（含结构预设）
// 依赖：core.js、analysis.js。本文件最后加载并启动应用。

    // ===== 力导向自动布局 =====
    // 节点间斥力 + 边引力迭代收敛，降低边交叉与节点重叠，让箭头指向更清晰
    function applyForceLayout(iterations) {
        iterations = iterations || 300;
        const n = nodes.length;
        if (n < 2) return;

        const rect = svg.getBoundingClientRect();
        const w = Math.max(320, rect.width || 800);
        const h = Math.max(240, rect.height || 600);
        const margin = 80;

        // 保存弧线控制点相对两端节点的几何参数（沿边比例 + 法向高度），布局后按新位置还原
        const arcSnap = [];
        edges.forEach(edge => {
            if (edge.type !== '~' || !edge.controlPoint) return;
            const u = getNodeById(edge.u);
            const v = getNodeById(edge.v);
            const cp = edge.controlPoint;
            const dx = v.x - u.x;
            const dy = v.y - u.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const ex = dx / len, ey = dy / len;
            const nx = -ey, ny = ex;
            const along = (cp.x - u.x) * ex + (cp.y - u.y) * ey;
            const height = (cp.x - (u.x + ex * along)) * nx + (cp.y - (u.y + ey * along)) * ny;
            arcSnap.push({ edge, t: clampNum(along / len, 0, 1), height });
        });

        // 理想边长与初始温度（Fruchterman-Reingold）
        const k = Math.sqrt((w - 2 * margin) * (h - 2 * margin) / Math.max(n, 1)) * 0.85;
        let temp = Math.min(w, h) / 5;
        const cooling = Math.pow(0.08 / Math.max(temp, 0.01), 1 / iterations);

        // 无向去重边表（平行边只计算一次引力）
        const seen = new Set();
        const links = [];
        edges.forEach(e => {
            const key = e.u < e.v ? e.u + '_' + e.v : e.v + '_' + e.u;
            if (!seen.has(key)) { seen.add(key); links.push([e.u, e.v]); }
        });

        for (let it = 0; it < iterations; it++) {
            const disp = [];
            for (let i = 0; i < n; i++) disp.push({ x: 0, y: 0 });

            // 斥力（库仑式）
            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    let dx = nodes[j].x - nodes[i].x;
                    let dy = nodes[j].y - nodes[i].y;
                    let d = Math.sqrt(dx * dx + dy * dy);
                    if (d < 1) {
                        dx = (Math.random() - 0.5) * 2;
                        dy = (Math.random() - 0.5) * 2;
                        d = Math.sqrt(dx * dx + dy * dy) || 1;
                    }
                    const f = k * k / d;
                    const fx = dx / d * f;
                    const fy = dy / d * f;
                    disp[i].x -= fx; disp[i].y -= fy;
                    disp[j].x += fx; disp[j].y += fy;
                }
            }

            // 引力（弹簧式）
            links.forEach(link => {
                const a = nodes[link[0]];
                const b = nodes[link[1]];
                const dx = b.x - a.x;
                const dy = b.y - a.y;
                const d = Math.sqrt(dx * dx + dy * dy) || 1;
                const f = d * d / k;
                const fx = dx / d * f;
                const fy = dy / d * f;
                disp[link[0]].x += fx; disp[link[0]].y += fy;
                disp[link[1]].x -= fx; disp[link[1]].y -= fy;
            });

            // 限制最大位移并约束在画布内
            for (let i = 0; i < n; i++) {
                let dx = disp[i].x;
                let dy = disp[i].y;
                const dl = Math.sqrt(dx * dx + dy * dy);
                if (dl > temp) { dx = dx / dl * temp; dy = dy / dl * temp; }
                nodes[i].x = Math.max(margin, Math.min(w - margin, nodes[i].x + dx));
                nodes[i].y = Math.max(margin, Math.min(h - margin, nodes[i].y + dy));
            }
            temp *= cooling;
        }

        // 还原弧线控制点：两端已移动，按保存的比例/高度重建，保持弧度形状
        arcSnap.forEach(s => {
            const u = getNodeById(s.edge.u);
            const v = getNodeById(s.edge.v);
            const dx = v.x - u.x;
            const dy = v.y - u.y;
            const len = Math.sqrt(dx * dx + dy * dy) || 1;
            const ex = dx / len, ey = dy / len;
            const nx = -ey, ny = ex;
            const along = s.t * len;
            s.edge.controlPoint = {
                x: u.x + ex * along + nx * s.height,
                y: u.y + ey * along + ny * s.height
            };
        });
    }

    // 工具栏“自动布局”入口：对当前画布所有节点重新布局
    function layoutGraph() {
        if (nodes.length === 0) return;
        hideAllMenus();
        applyForceLayout(320);
        optimizeArcs();   // 开启“自动优化弧线”时在布局后重排弧线，否则为无操作
        render();
    }

    // ===== 随机拓扑生成 =====
    const NODE_SHAPES = ['circle', 'square', 'triangle', 'pentagon', 'hexagon'];
    const NODE_COLORS = [
        '#409eff', '#67c23a', '#e6a23c', '#f56c6c', '#9b59b6',
        '#e74c3c', '#3498db', '#2ecc71', '#f39c12', '#1abc9c',
        '#8e44ad', '#e67e22', '#27ae60', '#2980b9', '#c0392b',
        '#16a085', '#d35400', '#7f8c8d', '#34495e', '#2c3e50'
    ];

    function randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function clampNum(v, min, max) {
        return Math.max(min, Math.min(max, v));
    }

    function readNum(id, fallback) {
        const v = Math.floor(Number(document.getElementById(id).value));
        return Number.isFinite(v) ? v : fallback;
    }

    const RAND_PRESET_INFO = {
        random: { label: '完全随机' },
        ring:   { label: '环形',   minN: 3,   maxN: 100, defaultN: 10,
                  desc: n => `环形：${n} 个节点围成一圈，自动生成 ${n} 条边，适合测试环路。` },
        star:   { label: '星形',   minN: 2,   maxN: 100, defaultN: 9,
                  desc: n => `星形：1 个中心 + ${n - 1} 个外围节点，自动生成 ${n - 1} 条边。` },
        tree:   { label: '树形',   minN: 2,   maxN: 150, defaultN: 12,
                  desc: n => `树形：连通且无环，自动生成 ${n - 1} 条边。` },
        wheel:  { label: '轮辐',   minN: 4,   maxN: 100, defaultN: 9,
                  desc: n => `轮辐：中心节点 + ${n - 1} 个轮缘节点（轮缘成环），自动生成 ${2 * (n - 1)} 条边。` },
        grid:   { label: '网格', desc: (r, c) => `网格：${r} 行 × ${c} 列 = ${r * c} 个节点，自动生成 ${r * (c - 1) + (r - 1) * c} 条边。` }
    };

    function refreshPresetTip() {
        const preset = document.getElementById('randPreset').value;
        const tip = document.getElementById('randPresetTip');
        if (preset === 'random') {
            const isRange = document.querySelector('input[name="randMode"]:checked').value === 'range';
            tip.textContent = isRange
                ? '完全随机：节点/连线数量在范围内随机选取。连线数上限 = 节点数 ×（节点数-1），超限自动截断。'
                : '指定数量：按下方节点/连线数量生成随机图。连线数上限 = 节点数 ×（节点数-1），超限自动截断。';
        } else if (preset === 'grid') {
            const r = clampNum(readNum('randGridRows', 4), 2, 20);
            const c = clampNum(readNum('randGridCols', 6), 2, 20);
            tip.textContent = RAND_PRESET_INFO.grid.desc(r, c);
        } else {
            const info = RAND_PRESET_INFO[preset];
            const n = clampNum(readNum('randPresetNodeCount', info.defaultN), info.minN, info.maxN);
            tip.textContent = info.desc(n);
        }
    }

    function togglePreset() {
        const preset = document.getElementById('randPreset').value;
        const isRandom = preset === 'random';
        const isGrid = preset === 'grid';
        const isCountOnly = !isRandom && !isGrid; // ring / star / tree / wheel

        document.getElementById('randModeRow').style.display = isRandom ? 'flex' : 'none';
        document.getElementById('randPresetNodeRow').style.display = isCountOnly ? 'flex' : 'none';
        document.getElementById('randGridRow').style.display = isGrid ? 'flex' : 'none';

        if (isCountOnly) {
            const info = RAND_PRESET_INFO[preset];
            const input = document.getElementById('randPresetNodeCount');
            input.min = info.minN;
            input.max = info.maxN;
            input.value = clampNum(readNum('randPresetNodeCount', info.defaultN), info.minN, info.maxN);
            document.getElementById('randPresetNodeLabel').textContent = `节点数量（${info.minN}~${info.maxN}）`;
        }
        if (isRandom) toggleRandMode(); // 按当前 radio 显示对应行
        refreshPresetTip();
    }

    function toggleRandMode() {
        const isRange = document.querySelector('input[name="randMode"]:checked').value === 'range';
        document.getElementById('randFixedRow').style.display = isRange ? 'none' : 'flex';
        document.getElementById('randNodeRangeRow').style.display = isRange ? 'flex' : 'none';
        document.getElementById('randEdgeRangeRow').style.display = isRange ? 'flex' : 'none';
        refreshPresetTip();
    }

    function setupRandInputListeners() {
        ['randPresetNodeCount', 'randGridRows', 'randGridCols'].forEach(id => {
            document.getElementById(id).addEventListener('input', refreshPresetTip);
        });
    }

    // 将节点散布在画布网格中并加入随机抖动，避免大量重叠
    function computeGridPositions(count, rect) {
        const margin = 70;
        const w = Math.max(200, rect.width - margin * 2);
        const h = Math.max(150, rect.height - margin * 2);
        const cols = Math.ceil(Math.sqrt(count * w / h));
        const rows = Math.ceil(count / cols);
        const cellW = w / cols;
        const cellH = h / rows;
        const positions = [];
        for (let i = 0; i < count; i++) {
            const c = i % cols;
            const r = Math.floor(i / cols);
            positions.push({
                x: margin + (c + 0.5) * cellW + (Math.random() - 0.5) * cellW * 0.6,
                y: margin + (r + 0.5) * cellH + (Math.random() - 0.5) * cellH * 0.6
            });
        }
        return shuffleArray(positions);
    }

    // 生成随机无向节点对：先构造随机生成树保证连通，再补充剩余边（避免同对重复）
    function buildRandomEdges(n, m) {
        const used = new Set();
        const specs = [];
        function tryAdd(u, v) {
            if (u === v) return false;
            const key = u < v ? u + '|' + v : v + '|' + u;
            if (used.has(key)) return false;
            used.add(key);
            return true;
        }

        if (m >= n - 1 && n > 1) {
            const order = shuffleArray([...Array(n).keys()]);
            for (let i = 1; i < n; i++) {
                const u = order[i];
                const v = order[randInt(0, i - 1)];
                tryAdd(u, v);
                specs.push({ u, v });
            }
        }

        let guard = 0;
        while (specs.length < m && guard < m * 30 + 200) {
            guard++;
            const u = randInt(0, n - 1);
            const v = randInt(0, n - 1);
            if (tryAdd(u, v)) specs.push({ u, v });
        }
        return specs;
    }

    function circlePositions(count, cx, cy, radius) {
        const arr = [];
        for (let i = 0; i < count; i++) {
            const a = -Math.PI / 2 + i * 2 * Math.PI / count;
            arr.push({ x: cx + radius * Math.cos(a), y: cy + radius * Math.sin(a) });
        }
        return arr;
    }

    function gridPositions(rows, cols, rect) {
        const pad = 70;
        const w = Math.max(160, rect.width - pad * 2);
        const h = Math.max(160, rect.height - pad * 2);
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const stepX = cols > 1 ? w / (cols - 1) : 0;
        const stepY = rows > 1 ? h / (rows - 1) : 0;
        const arr = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                arr.push({
                    x: cx + (c - (cols - 1) / 2) * stepX,
                    y: cy + (r - (rows - 1) / 2) * stepY
                });
            }
        }
        return arr;
    }

    // 根据“随机连线”开关为一条无向边生成方向/弯曲规格
    function pickEdgeSpec(randEdge) {
        if (!randEdge) return { type: '-', bidir: false };
        const r = randInt(0, 3);
        return { type: r < 2 ? '-' : '~', bidir: r % 2 === 1 };
    }

    // 规划一份“预设图”：返回 { n, m, positions, pairs }
    function buildPresetPlan(rect) {
        const preset = document.getElementById('randPreset').value;
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const radius = Math.max(90, Math.min(rect.width, rect.height) / 2 - 90);

        if (preset === 'random') {
            const mode = document.querySelector('input[name="randMode"]:checked').value;
            let n, m;
            if (mode === 'fixed') {
                n = clampNum(readNum('randNodeCount', 8), 2, 60);
                m = clampNum(readNum('randEdgeCount', 0), 0, n * (n - 1));
            } else {
                let nMin = clampNum(readNum('randNodeMin', 6), 2, 60);
                let nMax = clampNum(readNum('randNodeMax', 12), 2, 60);
                if (nMin > nMax) [nMin, nMax] = [nMax, nMin];
                n = randInt(nMin, nMax);
                const maxM = n * (n - 1);
                let mMin = clampNum(readNum('randEdgeMin', 4), 0, maxM);
                let mMax = clampNum(readNum('randEdgeMax', 15), 0, maxM);
                if (mMin > mMax) mMin = mMax;
                m = randInt(mMin, mMax);
            }
            m = Math.min(m, n * (n - 1));
            return {
                label: '随机图',
                n, m,
                positions: computeGridPositions(n, rect),
                pairs: buildRandomEdges(n, m)
            };
        }

        if (preset === 'grid') {
            const rows = clampNum(readNum('randGridRows', 4), 2, 20);
            const cols = clampNum(readNum('randGridCols', 6), 2, 20);
            const n = rows * cols;
            const pairs = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const idx = r * cols + c;
                    if (c < cols - 1) pairs.push({ u: idx, v: idx + 1 });       // → 右
                    if (r < rows - 1) pairs.push({ u: idx, v: idx + cols });    // ↓ 下
                }
            }
            return {
                label: '网格图',
                n, m: pairs.length,
                positions: gridPositions(rows, cols, rect),
                pairs
            };
        }

        if (preset === 'ring') {
            const info = RAND_PRESET_INFO.ring;
            const n = clampNum(readNum('randPresetNodeCount', info.defaultN), info.minN, info.maxN);
            const pairs = [];
            for (let i = 0; i < n; i++) pairs.push({ u: i, v: (i + 1) % n });
            return { label: '环形图', n, m: n, positions: circlePositions(n, cx, cy, radius), pairs };
        }

        if (preset === 'star') {
            const info = RAND_PRESET_INFO.star;
            const n = clampNum(readNum('randPresetNodeCount', info.defaultN), info.minN, info.maxN);
            const positions = [{ x: cx, y: cy }].concat(circlePositions(n - 1, cx, cy, radius * 0.9));
            const pairs = [];
            for (let i = 1; i < n; i++) pairs.push({ u: 0, v: i });
            return { label: '星形图', n, m: n - 1, positions, pairs };
        }

        if (preset === 'tree') {
            const info = RAND_PRESET_INFO.tree;
            const n = clampNum(readNum('randPresetNodeCount', info.defaultN), info.minN, info.maxN);
            // 随机标号树：每个节点随机连到一个更早的节点，保证连通无环
            const order = shuffleArray([...Array(n).keys()]);
            const pairs = [];
            for (let i = 1; i < n; i++) {
                pairs.push({ u: order[i], v: order[randInt(0, i - 1)] });
            }
            return { label: '树形图', n, m: n - 1, positions: circlePositions(n, cx, cy, radius), pairs };
        }

        if (preset === 'wheel') {
            const info = RAND_PRESET_INFO.wheel;
            const n = clampNum(readNum('randPresetNodeCount', info.defaultN), info.minN, info.maxN);
            const rim = n - 1;
            const positions = [{ x: cx, y: cy }].concat(circlePositions(rim, cx, cy, radius));
            const pairs = [];
            for (let i = 1; i < n; i++) pairs.push({ u: 0, v: i });          // 辐条
            for (let i = 1; i < n; i++) {                                     // 轮缘环
                pairs.push({ u: i, v: i + 1 > rim ? 1 : i + 1 });
            }
            return { label: '轮辐图', n, m: 2 * (n - 1), positions, pairs };
        }

        return null;
    }

    function generateRandomTopology() {
        refreshPresetTip();
        const rect = svg.getBoundingClientRect();
        const plan = buildPresetPlan(rect);
        if (!plan) return;

        const msg = `将清空当前画布，生成${plan.label}：${plan.n} 个节点、${plan.m} 条连线。\n是否继续？`;
        if (nodes.length > 0 && !confirm(msg)) return;

        const randShape = document.getElementById('randShape').checked;
        const randColor = document.getElementById('randColor').checked;
        const randSize = document.getElementById('randSize').checked;
        const randEdge = document.getElementById('randEdgeType').checked;
        const preset = document.getElementById('randPreset').value;

        resetAll();

        plan.positions.forEach(p => {
            nodes.push({
                id: nextNodeId++,
                x: p.x, y: p.y,
                color: randColor ? NODE_COLORS[randInt(0, NODE_COLORS.length - 1)] : '#409eff',
                shape: randShape ? NODE_SHAPES[randInt(0, NODE_SHAPES.length - 1)] : 'circle',
                size: randSize ? randInt(13, 26) : 18
            });
        });

        plan.pairs.forEach(s => {
            const spec = pickEdgeSpec(randEdge);
            addEdgeById(s.u, s.v, spec.type, spec.bidir);
        });

        // 随机图与树形图用力导向收敛，使布局更均匀；规则图（环/星/轮辐/网格）保留几何结构
        if (preset === 'random' || preset === 'tree') applyForceLayout(320);
        updatePathSelects();
        optimizeArcs();   // 开启“自动优化弧线”时在此优化，否则为无操作
        render();
    }


    init();
    </script>
